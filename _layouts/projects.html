---
layout: default
---

<h2>Projects</h2>

{% for project in site.data.projects %}
  <div class="project">
    <p class="project-title">{{ project.title }}</p>
    <p class="project-context">{{ project.context | markdownify | remove: "<p>" | remove: "</p>" }}</p>
    {{ project.description | markdownify }}
    {% if project.todo %}<p><span class="todo">{{ project.todo }}</span></p>{% endif %}
  </div>
{% endfor %}

{{ content }}
